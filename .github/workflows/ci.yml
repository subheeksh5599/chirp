name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      TON_WALLET_ADDRESS: ${{ secrets.TON_WALLET_ADDRESS }}
      PRESENCE_SIGNING_KEY: ${{ secrets.PRESENCE_SIGNING_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Glasses build calls only whitelisted origins
        run: node scripts/check-network-whitelist.mjs
      - name: Tests (server tests use a throwaway schema in the real database)
        run: npm test
