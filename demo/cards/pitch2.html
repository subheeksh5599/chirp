<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body class="card"><div class="wrap">
<div class="mark">Chirp</div>
<h1>Any speaker can talk to your glasses.</h1>
<p>A soft chirp carries a 9-character code. The glasses hear it, the lens shows a card, and one tap lands it in Telegram.</p>
<div class="flow">
 <div class="node"><b>Phone, laptop, PA</b><span>plays a soft chirp</span></div><div class="arrow">sound →</div>
 <div class="node lens"><b style="color:var(--accent)">G2 lens</b><span style="color:#4b8d64">shows the card</span></div><div class="arrow">tap →</div>
 <div class="node"><b>Telegram</b><span>link, contact, bill, record</span></div>
</div></div></body></html>
