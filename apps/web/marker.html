<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stream markers: Chirp</title>
    <meta name="description" content="Put the market you are talking about on viewers’ Chirp glasses, with live odds." />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <header class="top"><a class="mark" href="/">Chirp</a><a href="/">All tools</a></header>
      <h1>Stream markers</h1>
      <p class="lede">Talking about a market on your stream or podcast? Chirp it through your speakers, or download the sound and mix it in. Viewers wearing Chirp glasses see that market with live odds.</p>
      <div class="panel">
        <label for="q">Find a live market</label>
        <div class="row inline">
          <input id="q" placeholder="bitcoin, fed, election" />
          <button id="search">Search</button>
        </div>
        <div class="status" id="status"></div>
        <canvas class="wave" aria-hidden="true"></canvas>
        <ul class="list" id="results"></ul>
      </div>
    </main>
    <script type="module" src="/src/marker.ts"></script>
  </body>
</html>
