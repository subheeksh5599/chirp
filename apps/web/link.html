<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chirp · Share a link</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <header class="top"><span class="mark">Chirp</span><a href="/">all tools</a></header>
      <h1>Share a link</h1>
      <p class="lede">“The link is in the chat.” Instead, chirp it: hold your phone near your mic on a voice call, or play it in the room. Everyone wearing Chirp glasses sees it and saves it to Telegram with one tap. Works for notes too, like the Wi-Fi password at the door.</p>
      <div class="panel">
        <label for="title">Title</label>
        <input id="title" maxlength="60" placeholder="Launch thread" />
        <label for="url">Link (https, optional)</label>
        <input id="url" placeholder="https://…" />
        <label for="note">Note (optional)</label>
        <input id="note" maxlength="200" placeholder="network Studio5 · password …" />
        <div class="row">
          <div><label for="from">From (optional)</label><input id="from" maxlength="40" placeholder="your name" /></div>
          <div><label for="minutes">Valid for (minutes)</label><input id="minutes" type="number" min="1" max="120" value="10" /></div>
        </div>
        <div class="row">
          <button id="chirp">Chirp it</button>
          <button class="ghost hidden" id="again">Chirp again</button>
        </div>
        <div class="status" id="status"></div>
      </div>
    </main>
    <script type="module" src="/src/link.ts"></script>
  </body>
</html>
